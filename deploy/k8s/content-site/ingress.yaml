apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: content-site
  namespace: content-site
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: content.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: content-site
                port:
                  number: 80
  tls:
    - hosts:
        - content.example.com
      secretName: content-site-tls
