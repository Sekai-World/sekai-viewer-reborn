apiVersion: apps/v1
kind: Deployment
metadata:
  name: content-site
  namespace: content-site
  labels:
    app: content-site
spec:
  replicas: 2
  selector:
    matchLabels:
      app: content-site
  template:
    metadata:
      labels:
        app: content-site
    spec:
      automountServiceAccountToken: false
      containers:
        - name: web
          image: ghcr.io/your-org/content-site:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
