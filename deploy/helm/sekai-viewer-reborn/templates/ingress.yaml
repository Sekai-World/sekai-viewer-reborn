{{- $root := . -}}
{{- range $appName, $app := $root.Values.apps }}
{{- if and $app.enabled $app.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "sekai-viewer-reborn.appName" (list $root $appName) }}
  labels:
    {{- include "sekai-viewer-reborn.labels" (list $root $appName) | nindent 4 }}
  {{- with $app.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $app.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  rules:
    - host: {{ $app.ingress.host | quote }}
      http:
        paths:
          - path: {{ $app.ingress.path | quote }}
            pathType: {{ $app.ingress.pathType }}
            backend:
              service:
                name: {{ include "sekai-viewer-reborn.appName" (list $root $appName) }}
                port:
                  number: 80
  {{- if $app.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ $app.ingress.host | quote }}
      secretName: {{ $app.ingress.tls.secretName | quote }}
  {{- end }}
{{- end }}
{{- end }}
