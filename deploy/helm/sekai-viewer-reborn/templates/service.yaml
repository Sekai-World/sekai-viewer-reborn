{{- $root := . -}}
{{- range $appName, $app := $root.Values.apps }}
{{- if $app.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sekai-viewer-reborn.appName" (list $root $appName) }}
  labels:
    {{- include "sekai-viewer-reborn.labels" (list $root $appName) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "sekai-viewer-reborn.selectorLabels" (list $root $appName) | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
{{- end }}
{{- end }}
