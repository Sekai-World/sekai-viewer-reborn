<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      (() => {
        try {
          const name = localStorage.getItem("tools_site_theme_name");
          const mode = localStorage.getItem("tools_site_theme_mode");
          const themeName =
            name === "default" || name === "sakura" || name === "mint" ? name : "default";
          const themeMode = mode === "auto" || mode === "light" || mode === "dark" ? mode : "auto";
          const dark =
            themeMode === "dark" ||
            (themeMode === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = themeName;
          document.documentElement.classList.toggle("dark", dark);
        } catch {}
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" data-sveltekit-preload-code="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
