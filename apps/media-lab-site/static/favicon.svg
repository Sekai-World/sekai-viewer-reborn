<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Sekai Viewer Reborn favicon</title>
  <desc id="desc">A simplified high-contrast diagonal Sekai Viewer SV mark.</desc>
  <defs>
    <linearGradient id="bg" x1="10" x2="54" y1="8" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#06b6d4" />
      <stop offset="0.48" stop-color="#6366f1" />
      <stop offset="1" stop-color="#ec4899" />
    </linearGradient>
    <filter id="mark-shadow" width="140%" height="140%" x="-20%" y="-15%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.4" flood-color="#0f172a" flood-opacity="0.26" />
    </filter>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#bg)" />
  <path d="M9 51L55 13V64H9V51Z" fill="#0f172a" fill-opacity="0.16" />
  <path d="M9 13C20 7 33 6 44 10C36 12 24 17 11 28L9 13Z" fill="#ffffff" fill-opacity="0.18" />

  <g
    fill="#ffffff"
    filter="url(#mark-shadow)"
    font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="40"
    font-weight="850"
    text-anchor="middle"
  >
    <text x="24" y="37">S</text>
    <text x="41" y="53">V</text>
  </g>
</svg>
