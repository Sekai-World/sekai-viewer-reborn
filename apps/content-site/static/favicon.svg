<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Sekai Viewer Reborn favicon</title>
  <desc id="desc">A clean magnifying glass inspecting a colorful glass shard, inspired by Project Sekai stage-light visuals.</desc>
  <defs>
    <linearGradient id="bg" x1="8" x2="56" y1="6" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.58" stop-color="#eef7ff" />
      <stop offset="1" stop-color="#def1ff" />
    </linearGradient>
    <linearGradient id="beam-cyan" x1="10" x2="28" y1="10" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0.74" />
      <stop offset="1" stop-color="#67e8f9" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="beam-pink" x1="54" x2="34" y1="10" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f9a8d4" stop-opacity="0.72" />
      <stop offset="1" stop-color="#f9a8d4" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="lens-stroke" x1="18" x2="44" y1="18" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f766e" />
      <stop offset="0.52" stop-color="#0f172a" />
      <stop offset="1" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="lens-fill" x1="20" x2="42" y1="20" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.86" />
      <stop offset="1" stop-color="#dbeafe" stop-opacity="0.74" />
    </linearGradient>
    <linearGradient id="handle" x1="36" x2="51" y1="37" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#475569" />
      <stop offset="1" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="data-bar" x1="24" x2="39" y1="24" y2="35" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0ea5e9" />
      <stop offset="1" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="shard-cyan" x1="24" x2="31" y1="24" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#67e8f9" />
      <stop offset="1" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="shard-lime" x1="30" x2="36" y1="24" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d9f99d" />
      <stop offset="1" stop-color="#84cc16" />
    </linearGradient>
    <linearGradient id="shard-pink" x1="35" x2="40" y1="23" y2="39" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbcfe8" />
      <stop offset="1" stop-color="#f472b6" />
    </linearGradient>
    <filter id="shadow" width="150%" height="150%" x="-25%" y="-25%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#7dd3fc" flood-opacity="0.18" />
    </filter>
    <clipPath id="icon-clip">
      <rect x="1" y="1" width="62" height="62" rx="20" />
    </clipPath>
    <clipPath id="lens-clip">
      <circle cx="31" cy="29" r="12" />
    </clipPath>
  </defs>

  <g clip-path="url(#icon-clip)">
    <rect x="1" y="1" width="62" height="62" rx="20" fill="url(#bg)" />
    <g transform="translate(-2.6 -2.6) scale(1.08)">
      <path d="M8 8H56V17C47 15 40 14 32 14C23 14 15 16 8 19V8Z" fill="#ffffff" fill-opacity="0.7" />
      <path d="M9 10L23 36H31L18 10H9Z" fill="url(#beam-cyan)" />
      <path d="M55 10L40 36H33L47 10H55Z" fill="url(#beam-pink)" />

      <path d="M13 18L19 14L18 22L12 25L13 18Z" fill="#38bdf8" fill-opacity="0.45" />
      <path d="M45 13L51 10L49 17L43 20L45 13Z" fill="#fb7185" fill-opacity="0.4" />
      <path d="M47 24L52 20L53 27L48 30L47 24Z" fill="#f59e0b" fill-opacity="0.44" />
      <path d="M13 43L20 37L23 53L15 53L13 43Z" fill="#22d3ee" fill-opacity="0.72" />
      <path d="M42 39L49 44L51 53L43 53L42 39Z" fill="#f472b6" fill-opacity="0.7" />

      <g filter="url(#shadow)">
        <circle cx="31" cy="29" r="13.5" fill="none" stroke="url(#lens-stroke)" stroke-width="4.5" />
        <circle cx="31" cy="29" r="12.2" fill="none" stroke="#ffffff" stroke-opacity="0.65" stroke-width="1" />
        <circle cx="31" cy="29" r="11.5" fill="url(#lens-fill)" />
        <g clip-path="url(#lens-clip)">
          <path d="M22 34H40" stroke="#94a3b8" stroke-opacity="0.36" stroke-width="1" stroke-linecap="round" />
          <path d="M22 30H40" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1" stroke-linecap="round" />
          <path d="M22 26H40" stroke="#94a3b8" stroke-opacity="0.24" stroke-width="1" stroke-linecap="round" />
          <path d="M24 36L28 22L33 36H24Z" fill="url(#shard-cyan)" />
          <path d="M28 22L34 18L38 32L33 36L28 22Z" fill="url(#shard-lime)" />
          <path d="M34 18L40 23L38 32L33 36L34 18Z" fill="url(#shard-pink)" />
          <rect x="23.5" y="31" width="3" height="4.5" rx="1" fill="url(#data-bar)" fill-opacity="0.92" />
          <rect x="27.8" y="28.5" width="3" height="7" rx="1" fill="url(#data-bar)" fill-opacity="0.88" />
          <rect x="32.1" y="25.5" width="3" height="10" rx="1" fill="url(#data-bar)" fill-opacity="0.84" />
          <path d="M23.5 33L29.3 27.5L33.6 25.2L38.8 22.8" fill="none" stroke="#0f172a" stroke-opacity="0.66" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
          <circle cx="23.5" cy="33" r="1.2" fill="#ffffff" />
          <circle cx="29.3" cy="27.5" r="1.2" fill="#ffffff" />
          <circle cx="33.6" cy="25.2" r="1.2" fill="#ffffff" />
          <circle cx="38.8" cy="22.8" r="1.2" fill="#ffffff" />
          <path d="M24 19C27 17 31 16 35 17C38 18 40 19 42 22" fill="none" stroke="#ffffff" stroke-opacity="0.32" stroke-width="1.5" stroke-linecap="round" />
        </g>
        <path d="M39.5 38.5L48.5 47.5" stroke="url(#handle)" stroke-width="6" stroke-linecap="round" />
      </g>
      <circle cx="27" cy="25" r="1.4" fill="#ffffff" fill-opacity="0.9" />
    </g>
  </g>
</svg>
