# Builds and pushes one app image for an `@apps/<app>@<version>` release tag.
#
# Required repository secrets:
#   - ZOT_PUSH_USERNAME / ZOT_PUSH_PASSWORD: the push-only Zot user
#     registry-push-sekai-viewer-reborn, which may push only under
#     sekai-viewer-reborn/.
#
# The registry (zot.dna.moe) is reachable only on the Tailnet, so GitHub-hosted
# runners push through zot-push.dna.moe, a public endpoint in front of the same
# Zot that accepts pushes and refuses every read. Deployments pull the same
# image from zot.dna.moe.
name: Docker Publish

on:
  push:
    tags:
      # Release tags look like "@apps/content-site@1.2.3"; "**" is required so
      # the pattern crosses the "/" inside the app name.
      - "@apps/**@*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. @apps/content-site@0.0.1"
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PUSH_REGISTRY: zot-push.dna.moe
  IMAGE_REPOSITORY_PREFIX: sekai-viewer-reborn

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # A manual or Release-dispatched run is started on main, so check out the
      # release tag itself; the image must contain the tagged commit.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Resolve app and version from release tag
        id: meta
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tag="${RELEASE_TAG#@apps/}"
          app="${tag%@*}"
          version="${tag##*@}"
          if [ ! -f "apps/${app}/Dockerfile" ]; then
            echo "::error::No Dockerfile found for app '${app}' (tag ${RELEASE_TAG})"
            exit 1
          fi
          echo "app=${app}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.PUSH_REGISTRY }}
          username: ${{ secrets.ZOT_PUSH_USERNAME }}
          password: ${{ secrets.ZOT_PUSH_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ steps.meta.outputs.app }}/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.PUSH_REGISTRY }}/${{ env.IMAGE_REPOSITORY_PREFIX }}/${{ steps.meta.outputs.app }}:${{ steps.meta.outputs.version }}
            ${{ env.PUSH_REGISTRY }}/${{ env.IMAGE_REPOSITORY_PREFIX }}/${{ steps.meta.outputs.app }}:sha-${{ steps.meta.outputs.revision }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.revision }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=${{ steps.meta.outputs.app }}
          cache-to: type=gha,mode=max,scope=${{ steps.meta.outputs.app }}
