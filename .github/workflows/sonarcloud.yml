name: SonarCloud

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          experimental: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Rebuild esbuild
        run: pnpm rebuild esbuild
      - name: Generate SvelteKit TypeScript configs
        run: |
          pnpm --filter @apps/account-site exec svelte-kit sync
          pnpm --filter @apps/content-site exec svelte-kit sync
          pnpm --filter @apps/media-lab-site exec svelte-kit sync
          pnpm --filter @apps/tools-site exec svelte-kit sync
      - name: Run unit tests with coverage
        run: |
          pnpm --filter @apps/account-site run test:coverage
          pnpm --filter @apps/content-site run test:coverage
          pnpm --filter @apps/media-lab-site run test:coverage
          pnpm --filter @apps/tools-site run test:coverage
          pnpm --filter @platform/i18n-runtime run test:coverage
          pnpm --filter @platform/ui-shell run test:coverage
          pnpm --filter @platform/live2d-story-player run test:coverage
      - name: SonarCloud Scan
        if: >-
          github.event_name == 'push' ||
          (
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.user.login != 'dependabot[bot]'
          )
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
