name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mise tools
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          experimental: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild esbuild
        run: pnpm rebuild esbuild

      - name: Configure content-site environment
        run: cp apps/content-site/.env.example apps/content-site/.env

      - name: Verify
        run: pnpm verify:ci
        env:
          SYNCKIT_TIMEOUT: "120000"
          TURBO_CONCURRENCY: "2"

  validate-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mise tools
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          experimental: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild esbuild
        run: pnpm rebuild esbuild

      - name: Verify
        run: pnpm verify:ci

  e2e-media-lab-site:
    name: e2e (media-lab-site)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise tools
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          experimental: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild esbuild
        run: pnpm rebuild esbuild

      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @apps/media-lab-site exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium and system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @apps/media-lab-site exec playwright install --with-deps chromium

      - name: Install system dependencies only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @apps/media-lab-site exec playwright install-deps chromium

      - name: Run media-lab-site end-to-end tests
        run: pnpm --filter @apps/media-lab-site test:e2e

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: media-lab-site-e2e-report
          if-no-files-found: ignore
          retention-days: 7
          path: |
            apps/media-lab-site/test-results/
            apps/media-lab-site/playwright-report/

  docker-image-smoke:
    name: Docker image smoke (${{ matrix.app }})
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        app:
          - content-site
          - tools-site
          - media-lab-site
          - account-site

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js for the smoke harness
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Test smoke harness
        run: node --test scripts/verify-docker-image.test.mjs

      - name: Build local image and run HTTP smoke test
        env:
          APP: ${{ matrix.app }}
        run: |
          image="sekai-viewer-${APP}:ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # This job only builds and runs a local image; it has no registry login or push step.
          docker build --pull --tag "$image" --file "apps/${APP}/Dockerfile" .
          node scripts/verify-docker-image.mjs "$APP" "$image"
