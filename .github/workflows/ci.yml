name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mise tools
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          experimental: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild esbuild
        run: pnpm rebuild esbuild

      - name: Configure content-site environment
        run: cp apps/content-site/.env.example apps/content-site/.env

      - name: Verify
        run: pnpm verify:ci
        env:
          SYNCKIT_TIMEOUT: "120000"
          TURBO_CONCURRENCY: "2"

  validate-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mise tools
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          experimental: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild esbuild
        run: pnpm rebuild esbuild

      - name: Verify
        run: pnpm verify:ci

  detect-visual-changes:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.filter.outputs.changed }}

    steps:
      - name: Checkout repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect Svelte and stylesheet changes
        id: filter
        env:
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            changed_files="$(git diff --name-only "$BASE_SHA...$GITHUB_SHA")"
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            changed_files="$(git diff --name-only "$(git hash-object -t tree /dev/null)" "$GITHUB_SHA")"
          else
            changed_files="$(git diff --name-only "$BEFORE_SHA...$GITHUB_SHA")"
          fi

          if grep -Eq '\.(svelte|css|scss)$' <<< "$changed_files"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  visual-regression:
    needs: detect-visual-changes
    if: needs.detect-visual-changes.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise tools
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          experimental: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild esbuild
        run: pnpm rebuild esbuild

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run current-event visual regression tests
        run: pnpm test:visual

      - name: Upload visual regression artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-regression-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            test-results/
            playwright-report/
            apps/content-site/tests/visual/**/*-snapshots/
