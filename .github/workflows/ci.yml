name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mise tools
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          experimental: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild esbuild
        run: pnpm rebuild esbuild

      - name: Configure content-site environment
        run: cp apps/content-site/.env.example apps/content-site/.env

      - name: Verify
        run: pnpm verify:ci
        env:
          SYNCKIT_TIMEOUT: "120000"
          TURBO_CONCURRENCY: "2"

  validate-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mise tools
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          experimental: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild esbuild
        run: pnpm rebuild esbuild

      - name: Verify
        run: pnpm verify:ci

  docker-image-smoke:
    name: Docker image smoke (${{ matrix.app }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        app:
          - content-site
          - tools-site
          - media-lab-site
          - account-site

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js for the smoke harness
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Test smoke harness
        run: node --test scripts/verify-docker-image.test.mjs

      - name: Build local image and run HTTP smoke test
        env:
          APP: ${{ matrix.app }}
        run: |
          image="sekai-viewer-${APP}:ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # This job only builds and runs a local image; it has no registry login or push step.
          docker build --pull --tag "$image" --file "apps/${APP}/Dockerfile" .
          node scripts/verify-docker-image.mjs "$APP" "$image"
