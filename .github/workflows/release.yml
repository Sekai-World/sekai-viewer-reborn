name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup mise tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Configure content-site environment
        run: cp apps/content-site/.env.example apps/content-site/.env

      - name: Rebuild esbuild
        run: pnpm rebuild esbuild

      - name: Lint
        run: pnpm lint

      - name: Check types
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Create or update release PR
        id: changesets
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          version-script: pnpm release:version
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Refresh git tags
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: git fetch --force --tags

      - name: Publish workspace GitHub releases
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: pnpm release:github
        env:
          GIT_BASE_SHA: ${{ github.event.before }}
          GIT_HEAD_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Tag pushes made with GITHUB_TOKEN do not trigger other workflows, so
      # dispatch the image builds explicitly. workflow_dispatch is exempt from
      # that restriction.
      - name: Trigger app image builds for pushed release tags
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          git fetch --force --tags
          tags="$(git tag --points-at "${GIT_HEAD_SHA:-HEAD}" | grep '^@apps/' || true)"
          if [ -z "$tags" ]; then
            echo "No app release tags on this commit; nothing to build."
            exit 0
          fi
          while IFS= read -r tag; do
            echo "Dispatching Docker Publish for ${tag}"
            gh workflow run docker-publish.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main \
              -f tag="$tag"
          done <<< "$tags"
        env:
          GIT_HEAD_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
