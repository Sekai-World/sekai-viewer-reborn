name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup mise tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          experimental: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Configure content-site environment
        run: cp apps/content-site/.env.example apps/content-site/.env

      - name: Rebuild esbuild
        run: pnpm rebuild esbuild

      - name: Lint
        run: pnpm lint

      - name: Check types
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Create or update release PR
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm release:version
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Refresh git tags
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: git fetch --force --tags

      - name: Publish workspace GitHub releases
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: pnpm release:github
        env:
          GIT_BASE_SHA: ${{ github.event.before }}
          GIT_HEAD_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
