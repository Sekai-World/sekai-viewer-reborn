name: Sync I18n Source

on:
  push:
    branches:
      - main
    paths:
      - "packages/i18n-source/**"
      - "scripts/i18n/**"
      - ".github/workflows/i18n-sync.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app repository
        uses: actions/checkout@v5
        with:
          path: app

      - name: Create i18n app token
        id: i18n-app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.I18N_SYNC_APP_ID }}
          private-key: ${{ secrets.I18N_SYNC_APP_PRIVATE_KEY }}
          owner: Sekai-World
          repositories: sekai-i18n-reborn

      - name: Checkout translation repository
        uses: actions/checkout@v5
        with:
          repository: Sekai-World/sekai-i18n-reborn
          token: ${{ steps.i18n-app-token.outputs.token }}
          path: i18n

      - name: Setup mise tools
        uses: jdx/mise-action@v3
        with:
          experimental: true
          working_directory: app

      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Sync source dictionaries
        working-directory: app
        run: pnpm i18n:sync --target ../i18n

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.i18n-app-token.outputs.token }}
          path: i18n
          branch: sync/content-site-i18n-source
          delete-branch: true
          commit-message: "chore(content-site): sync i18n source strings"
          title: "chore(content-site): sync i18n source strings"
          body: |
            Automated sync from `Sekai-World/sekai-viewer-reborn`.

            This updates the English source dictionaries used by Weblate.
