name: Sync I18n Source

on:
  push:
    branches:
      - main
    paths:
      - "packages/i18n-source/**"
      - "scripts/i18n/**"
      - ".github/workflows/i18n-sync.yml"
  workflow_dispatch:
    inputs:
      prune:
        description: "Remove keys from English source dictionaries when they no longer exist in this repository"
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: app

      - name: Create i18n app token
        id: i18n-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.I18N_SYNC_CLIENT_ID }}
          private-key: ${{ secrets.I18N_SYNC_APP_PRIVATE_KEY }}
          owner: Sekai-World
          repositories: sekai-i18n-reborn
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout translation repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Sekai-World/sekai-i18n-reborn
          token: ${{ steps.i18n-app-token.outputs.token }}
          persist-credentials: false
          path: i18n

      - name: Setup mise tools
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          experimental: true
          working_directory: app

      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Sync source dictionaries
        working-directory: app
        run: pnpm i18n:sync --target ../i18n ${{ github.event_name == 'workflow_dispatch' && inputs.prune && '--prune' || '' }}

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.i18n-app-token.outputs.token }}
          path: i18n
          branch: sync/content-site-i18n-source
          delete-branch: true
          commit-message: "chore(content-site): sync i18n source strings"
          title: "chore(content-site): sync i18n source strings"
          body: |
            Automated sync from `Sekai-World/sekai-viewer-reborn`.

            This updates the English source dictionaries used by Weblate.
